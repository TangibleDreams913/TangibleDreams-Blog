<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TangibleDreams - 首页</title>
  <meta name="description" content="TangibleDreams 的个人博客 - 首页">
  <script src="/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/home.css">
  <link rel="stylesheet" href="/assets/css/article.css">
  <link rel="stylesheet" href="/assets/css/images.css">
  <link rel="stylesheet" href="/assets/css/music.css">
  <link rel="stylesheet" href="/assets/css/guestbook.css">
  <link rel="icon" type="image/png" href="/assets/icons/head.png">
  <link rel="canonical" href="https://tangibledreams.top/">
  <meta property="og:site_name" content="TangibleDreams">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="TangibleDreams - 首页">
  <meta property="og:description" content="TangibleDreams 的个人博客 - 首页">
  <meta property="og:url" content="https://tangibledreams.top/">
  <meta property="og:image" content="https://tangibledreams.top/assets/icons/head.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="TangibleDreams - 首页">
  <meta name="twitter:description" content="TangibleDreams 的个人博客 - 首页">
  <meta name="twitter:image" content="https://tangibledreams.top/assets/icons/head.png">
</head>
<body>
  <!-- 顶部导航栏（由 common.js 渲染） -->
  <header id="site-nav"></header>

  <main class="container">
    <!-- 个人信息区块 -->
    <section id="profile-section" class="profile-card">
      <img class="profile-avatar" id="profile-avatar"
           src="/assets/icons/head.png"
           alt="avatar" onerror="this.style.visibility='hidden'">
      <div class="profile-info">
        <div class="profile-name-wrapper">
				<h1 id="profile-name">加载中…</h1>
			</div>
        <div class="bio" id="profile-bio"></div>
        <div class="meta" id="profile-meta"></div>
      </div>
    </section>

    <!-- 精选文章区块 -->
    <section class="panel">
      <div class="section-title">
        <span>精选文章</span>
        <a class="more-link" href="/article/index.html">查看全部文章 »</a>
      </div>
      <div id="featured-article">
        <!-- 文章卡片挂载点 -->
      </div>
    </section>

    <!-- 精选图片区块 -->
    <section class="panel">
      <div class="section-title">
        <span>精选图片</span>
        <a class="more-link" href="/images/index.html">查看图片画廊 »</a>
      </div>
      <div id="featured-images">
        <!-- 图片卡片挂载点 -->
      </div>
    </section>

    <!-- 精选音乐区块 -->
    <section class="panel">
      <div class="section-title">
        <span>精选音乐</span>
        <a class="more-link" href="/music/index.html">查看全部音乐 »</a>
      </div>
      <div id="featured-music">
        <!-- 音乐卡片挂载点 -->
      </div>
    </section>

    <!-- 精选留言区块 -->
    <section class="panel">
      <div class="section-title">
        <span>精选留言</span>
        <a class="more-link" href="/guestbook/index.html">查看留言板 »</a>
      </div>
      <div id="featured-guestbook">
        <!-- 精选留言挂载点（复用留言板卡片样式） -->
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> TangibleDreams 版权所有，未经许可不得转载。</p>
    <p>本网站基于 ckckh2023 的 xiao-blog 构建，遵循 MIT 许可证。</p>
    <p>Powered by Cloudflare Pages</p>
  </footer>

  <!-- 全局共享逻辑 -->
  <script src="/assets/js/common.js"></script>
  <!-- Markdown 渲染 + 消毒（精选留言正文，与留言板一致） -->
  <script src="/assets/vendor/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <!-- 留言卡片共享渲染（精选留言，与留言板一致） -->
  <script src="/assets/js/gb-card.js"></script>
  <!-- 首页专属逻辑（个人信息 / 精选留言） -->
  <script src="/assets/js/home.js"></script>
  <!-- 文章 / 图片 / 音乐卡片渲染 -->
  <script src="/assets/js/article.js"></script>
  <script src="/assets/js/images.js"></script>
  <script src="/assets/js/music.js"></script>
  <script>
    /* 地点图标 SVG */
    var ICON_LOCATION = '<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="m12.596 11.614-.01-.01-.011-.01a4.866 4.866 0 0 0-.119-.116 5.75 5.75 0 0 0-7.756-7.756 4.866 4.866 0 0 0-.116.119l-.01.011-.01.01L0 14.25l3.614-3.614Z"/></svg>';

    /* 个人信息：本地数据直接渲染，签名（bio）作为个人签名展示 */
    function renderProfile(p) {
      document.getElementById("profile-name").textContent = p.name;
      document.getElementById("profile-bio").textContent = p.bio || "";
      var meta = [];
      if (p.location) meta.push(ICON_LOCATION + " " + p.location);
      document.getElementById("profile-meta").innerHTML =
        meta.map(function (t) { return "<span>" + t + "</span>"; }).join("");
    }
    fetchLocalProfile().then(function (p) {
      renderProfile(p);
    });

    /* 精选文章：从 /article/star.json 加载，每行 2 个 */
    fetchStararticle().then(function (list) {
      mountNovelGrid("#featured-article", list.slice(0, 2), 2);
    });

    /* 精选图片：从 /images/star.json 加载，每行 3 个 */
    fetchStarImages().then(function (list) {
      mountImageGrid("#featured-images", list.slice(0, 3), 3);
    });

    /* 精选音乐：从 /music/star.json 加载，每行 2 个 */
    fetchStarMusic().then(function (list) {
      mountMusicList("#featured-music", list.slice(0, 2), 2);
    });

    /* 精选留言：从 /guestbook/star.json 加载留言 id 数组，按 id 从 D1 数据库批量获取渲染 */
    fetchStarGuestbook().then(function (list) {
      mountGuestbookCards("#featured-guestbook", list);
    });
  </script>
</body>
</html>
