<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TangibleDreams - 音乐</title>
  <meta name="description" content="TangibleDreams 的音乐收藏与在线播放">
  <script src="/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/music.css">
  <link rel="icon" type="image/png" href="/assets/icons/head.png">
  <link rel="canonical" href="https://tangibledreams.top/music/index.html">
  <meta property="og:site_name" content="TangibleDreams">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="TangibleDreams - 音乐">
  <meta property="og:description" content="TangibleDreams 的音乐收藏与在线播放">
  <meta property="og:url" content="https://tangibledreams.top/music/index.html">
  <meta property="og:image" content="https://tangibledreams.top/assets/icons/head.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="TangibleDreams - 音乐">
  <meta name="twitter:description" content="TangibleDreams 的音乐收藏与在线播放">
  <meta name="twitter:image" content="https://tangibledreams.top/assets/icons/head.png">
</head>
<body>
  <header id="site-nav"></header>

  <main class="container wide">
    <div class="section-title">
      <div class="title-left">
        <span>音乐收藏</span>
        <div id="music-search"></div>
      </div>
      <a class="more-link" href="/index.html">« 返回首页</a>
    </div>

    <div id="all-music">
      <div class="status-box">加载中…</div>
    </div>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> TangibleDreams 版权所有，未经许可不得转载。</p>
    <p>本网站基于 ckckh2023 的 xiao-blog 构建，遵循 MIT 许可证。</p>
    <p>Powered by Cloudflare Pages</p>
  </footer>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/js/music.js"></script>
  <script>
    /* 全部音乐：从 /music/MusicList.json 加载；搜索对标题 / 艺术家 / 简介实时过滤 */
    var allMusic = [];

    function matchMusic(it, q) {
      if (!q) return true;
      var fields = [it.title, it.artist, it.description, it.id];
      for (var i = 0; i < fields.length; i++) {
        if (fields[i] && String(fields[i]).toLowerCase().indexOf(q) !== -1) return true;
      }
      return false;
    }

    function renderMusic(list, hasQuery) {
      var box = document.getElementById("all-music");
      if (!list.length) {
        box.innerHTML = '<div class="status-box">' +
          (hasQuery ? "未找到匹配的音乐。" : "暂无音乐，请等待博主上传。") + "</div>";
        return;
      }
      mountMusicList("#all-music", list, 2);
    }

    fetchMusicList().then(function (list) {
      allMusic = list;
      renderMusic(allMusic, false);
      mountSearchBox("#music-search", {
        placeholder: "搜索音乐…",
        onQuery: function (q) {
          renderMusic(allMusic.filter(function (it) { return matchMusic(it, q); }), !!q);
        }
      });
    });
  </script>
</body>
</html>
