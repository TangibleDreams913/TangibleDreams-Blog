<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TangibleDreams - 留言</title>
  <meta name="description" content="TangibleDreams 的留言板 - 访客留言墙，支持 Markdown">
  <script src="/assets/js/theme-init.js"></script>
  <link rel="stylesheet" href="/assets/css/common.css">
  <link rel="stylesheet" href="/assets/css/guestbook.css">
  <link rel="icon" type="image/png" href="/assets/icons/head.png">
  <link rel="canonical" href="https://tangibledreams.top/guestbook/index.html">
  <meta property="og:site_name" content="TangibleDreams">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:title" content="TangibleDreams - 留言板">
  <meta property="og:description" content="TangibleDreams 的留言板 - 访客留言墙，支持 Markdown">
  <meta property="og:url" content="https://tangibledreams.top/guestbook/index.html">
  <meta property="og:image" content="https://tangibledreams.top/assets/icons/head.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="TangibleDreams - 留言板">
  <meta name="twitter:description" content="TangibleDreams 的留言板 - 访客留言墙，支持 Markdown">
  <meta name="twitter:image" content="https://tangibledreams.top/assets/icons/head.png">
</head>
<body>
  <header id="site-nav"></header>

  <main class="container">
    <div class="section-title">
      <span>留言板</span>
      <a class="more-link" href="/index.html">« 返回首页</a>
    </div>

    <!-- 发布入口：自制表单（昵称 + 可选 QQ 号（仅用于获取头像）+ Markdown 内容） -->
    <section class="panel">
      <div class="section-title">
        <span>写下你的留言</span>
      </div>
      <form id="guestbook-form" class="gb-form">
        <div class="gb-form-row">
          <input id="gb-input-name" class="gb-input" type="text" maxlength="32"
                 placeholder="昵称 *" required autocomplete="off">
          <input id="gb-input-qq" class="gb-input" type="text" inputmode="numeric"
                 maxlength="11" placeholder="QQ（仅用于获取头像，本站不存储相关数据）" autocomplete="off">
        </div>
        <textarea id="gb-input-body" class="gb-textarea" rows="4" maxlength="2000"
                  placeholder="留言内容（支持 Markdown格式）*" required></textarea>
        <div class="gb-form-foot">
          <span id="gb-form-hint" class="gb-form-hint"></span>
          <div class="gb-form-actions">
            <button id="gb-preview" class="btn" type="button">预览留言</button>
            <button id="gb-submit" class="btn btn-primary" type="submit">发布留言</button>
          </div>
        </div>
      </form>
    </section>

    <!-- 留言墙：卡片样式 -->
    <section class="panel">
      <div class="section-title">
        <div class="title-left">
          <span>全部留言</span>
          <div id="gb-search"></div>
        </div>
        <button class="btn" id="guestbook-refresh" type="button" aria-label="刷新留言" title="刷新留言">
          <svg class="gb-refresh-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <polyline points="21 3 21 9 15 9"/>
          </svg>
        </button>
      </div>
      <div id="guestbook-wall">
        <div class="status-box">加载中…</div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>© <span id="year"></span> TangibleDreams 版权所有，未经许可不得转载。</p>
    <p>本网站基于 ckckh2023 的 xiao-blog 构建，遵循 MIT 许可证。</p>
    <p>Powered by Cloudflare Pages</p>
  </footer>

  <script src="/assets/js/common.js"></script>
  <script src="/assets/vendor/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="/assets/js/gb-card.js"></script>
  <script src="/assets/js/guestbook.js"></script>
</body>
</html>
